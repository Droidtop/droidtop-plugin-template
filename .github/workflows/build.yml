# Every push and pull request: the tests, then the bundle (built, tested again). A push to the default branch also
# signs the bundle with this repository's key and publishes it as a release, once the key is set up (README, Signing).
# Pull requests and forks have no secrets, so they build and test but never sign.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
          persist-credentials: false

      # A change to what the plugin runs carries a new declared version, so two different builds never share one.
      - name: The declared version moves with the code
        run: |
          if git rev-parse -q --verify HEAD~1 >/dev/null; then
            if git diff --quiet HEAD~1 HEAD -- src build.sh manifest.template.json; then
              echo "no plugin source changed"
            else
              old="$(git show HEAD~1:manifest.template.json 2>/dev/null | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])' || true)"
              new="$(python3 -c 'import json; print(json.load(open("manifest.template.json"))["version"])')"
              if [ -n "$old" ] && [ "$old" = "$new" ]; then
                echo "::error::plugin sources changed but manifest.template.json still declares $new; raise it (and CHANGELOG.md)"
                exit 1
              fi
              echo "declared version $old -> $new"
            fi
          fi

      - run: python3 test_plugin.py

  bundle:
    name: Plugin bundle
    needs: check
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build the bundle (unsigned)
        env:
          DROIDTOP_PLUGIN_BUILD: ${{ github.run_number }}
        run: ./build.sh

      - name: The tests once more, on what was built
        run: python3 test_plugin.py

      - name: Sign
        id: sign
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          KEY_PEM: ${{ secrets.PLUGIN_SIGNING_KEY }}
          CERT_PEM: ${{ secrets.PLUGIN_SIGNING_CERT }}
        run: |
          if [ -z "$KEY_PEM" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "PLUGIN_SIGNING_KEY is not set: no signed bundle, no release (README, Signing)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test -n "$CERT_PEM" || { echo "::error::PLUGIN_SIGNING_KEY is set but PLUGIN_SIGNING_CERT is not"; exit 1; }
          test -f droidtop-plugin-key.json || { echo "::error::commit droidtop-plugin-key.json (README, Signing)"; exit 1; }
          umask 077
          KEYFILE="$RUNNER_TEMP/plugin-signing-key.pem"
          CERTFILE="$RUNNER_TEMP/plugin-signing-cert.pem"
          printf '%s\n' "$KEY_PEM" > "$KEYFILE"
          printf '%s\n' "$CERT_PEM" > "$CERTFILE"
          PLUGIN_SIGNING_KEY_FILE="$KEYFILE" PLUGIN_SIGNING_CERT_FILE="$CERTFILE" ./sign.sh
          rm -f -- "$KEYFILE" "$CERTFILE"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id="$(python3 -c "import json; print(json.load(open('build/manifest.json'))['id'])")"
          version="$(python3 -c "import json; print(json.load(open('build/manifest.json'))['version'])")"
          label="$(python3 -c "import json; print(json.load(open('build/manifest.json'))['label'])")"
          cp build/manifest.json "$id.manifest.json"
          gh release create "v$version" "$id.droidplugin.tar.xz" "$id.manifest.json" droidtop-plugin-key.json \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "$label $version" \
            --notes "Signed droidtop plugin bundle built from ${{ github.sha }}. What changed: CHANGELOG.md."

      # Optional: ask your catalog to list the release now instead of on its schedule. Set the repository variable
      # CATALOG_REPO (owner/repo) and the secret CATALOG_DISPATCH_TOKEN (a fine-grained token with contents: write on
      # that repository only). Without them this step does nothing.
      - name: Ask the catalog to reindex
        if: steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOG_DISPATCH_TOKEN }}
          CATALOG_REPO: ${{ vars.CATALOG_REPO }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ] || [ -z "${CATALOG_REPO:-}" ]; then
            echo "No CATALOG_REPO or CATALOG_DISPATCH_TOKEN: the catalog lists this release on its schedule."
            exit 0
          fi
          gh api "repos/$CATALOG_REPO/dispatches" -f event_type=plugin-published -f "client_payload[repo]=$GH_REPO"
